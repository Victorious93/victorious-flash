name: Build Linux bundles
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Rust tests (device filtering, checksums, catalog)
        run: cargo test -p flash-core
      - name: Build privileged helper
        run: cargo build --release -p victorious-flash-helper
      - name: Build AppImage + .deb
        run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: victorious-flash-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
