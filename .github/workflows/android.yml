name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'catalog/**', 'assets/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'catalog/**', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: victorious-flash-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          compression-level: 0
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-test-reports
          path: android/app/build/reports
          retention-days: 3
