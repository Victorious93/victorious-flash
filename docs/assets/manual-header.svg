<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Victorious Flash Manual">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#0B1530"/>
  <circle cx="160" cy="150" r="95" fill="none" stroke="url(#neon)" stroke-width="14" filter="url(#glow)"/>
  <path d="M120 105 L160 200 L200 105" fill="none" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="168" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#neon)" filter="url(#glow)">Victorious Flash Manual</text>
  <text x="302" y="215" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="24" fill="#C9D4F2">Pick a Linux. Verify it. Flash it. Install it.</text>
</svg>
