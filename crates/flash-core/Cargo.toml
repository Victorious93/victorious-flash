[package]
name = "flash-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
# Statically builds liblzma, so no system library is needed at runtime.
xz2 = { version = "0.1", features = ["static"] }
